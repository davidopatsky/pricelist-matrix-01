<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Ceník produktů</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0e0f11;
    --bg-surface: #16181c;
    --bg-elevated: #1e2025;
    --border: #2a2d35;
    --border-subtle: #2a2e37;
    --text: #eceef3;
    --text-muted: #9095a4;
    --text-dim: #6b7082;
    --accent: #4a9eff;
    --highlight-row: rgba(74, 158, 255, 0.20);
    --highlight-col: rgba(74, 158, 255, 0.20);
    --highlight-cell: #4a9eff;
    --highlight-cell-text: #06101f;
    --highlight-head: #2f6fc4;
    --zebra: rgba(255, 255, 255, 0.028);
    --copied-flash: rgba(125, 190, 255, 0.55);
    --header-bg: #1a1d24;
    --corner-bg: #1a1d24;
    --tab-inactive: #7a7e89;
    --toast-bg: #1e2025;
    --toast-border: #4a9eff;
    --discount-bg: rgba(52, 211, 153, 0.08);
    --discount-border: rgba(52, 211, 153, 0.25);
    --discount-text: #34d399;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
  }

  /* ── TOP NAV ── */
  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 62px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    padding: 8px 20px 0;
    gap: 4px;
    z-index: 100;
    overflow-x: scroll;
    overflow-y: hidden;
    scrollbar-width: auto;
    scrollbar-color: #3a3e4a #1e2028;
  }
  .top-bar::-webkit-scrollbar { height: 10px; -webkit-appearance: none; }
  .top-bar::-webkit-scrollbar-track { background: #1e2028; border-top: 1px solid #0a0b0e; }
  .top-bar::-webkit-scrollbar-thumb { background: #3a3e4a; border-radius: 5px; border: 2px solid #1e2028; min-width: 60px; }
  .top-bar::-webkit-scrollbar-thumb:hover { background: #50545e; }

  .top-logo {
    height: 26px;
    margin-right: 14px;
    margin-bottom: 12px;
    flex-shrink: 0;
    filter: invert(1) hue-rotate(180deg) brightness(1.5);
  }
  .top-logo-divider {
    width: 1px;
    height: 24px;
    margin-bottom: 12px;
    background: var(--border);
    margin-right: 10px;
    flex-shrink: 0;
  }

  .nav-tab {
    margin-bottom: 12px;
    padding: 7px 18px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 500;
    color: #8b90a0;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    user-select: none;
    letter-spacing: 0.01em;
  }
  .nav-tab:hover {
    color: #c8cbda;
    background: var(--bg-elevated);
  }
  .nav-tab.active {
    color: #fff;
    background: rgba(74, 158, 255, 0.15);
    font-weight: 600;
  }

  /* Tabs are <button>s now: reset UA styles, but only font-family — the
     `font` shorthand would override .nav-tab's size/weight. */
  button.nav-tab {
    font-family: inherit;
    border: none;
    background: transparent;
  }

  /* ── NAV GROUPS (tap-to-open dropdowns) ── */
  .nav-group {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .nav-chevron {
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    opacity: 0.7;
    transition: transform 0.15s ease;
  }
  .nav-group.open { color: #c8cbda; background: var(--bg-elevated); }
  .nav-group.open .nav-chevron { transform: rotate(180deg); }
  .nav-sep {
    width: 1px;
    height: 20px;
    background: var(--border);
    margin: 6px 6px 12px;
    flex-shrink: 0;
  }
  .nav-dropdown {
    position: fixed;
    z-index: 300;
    display: none;
    min-width: 240px;
    max-height: 70vh;
    overflow-y: auto;
    padding: 6px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }
  .nav-dropdown.open { display: block; }
  .nav-dropdown-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    white-space: nowrap;
    cursor: pointer;
  }
  .nav-dropdown-item:hover { background: rgba(255, 255, 255, 0.06); }
  .nav-dropdown-item.active {
    background: rgba(74, 158, 255, 0.18);
    color: #fff;
    font-weight: 600;
  }
  /* Phones: full-width sheet, bigger tap targets, long names wrap */
  @media (max-width: 640px) {
    .nav-dropdown { min-width: 0; }
    .nav-dropdown-item { padding: 13px 16px; font-size: 16px; white-space: normal; }
  }

  /* ── MAIN AREA (scrollable) ── */
  .main {
    position: fixed;
    top: 62px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    transition: bottom 0.2s ease;
  }
  .main.bar-visible {
    bottom: 56px;
  }
  .main::-webkit-scrollbar { width: 6px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── PRODUCT HEADER ── */
  .product-header {
    padding: 12px 20px 0;
  }
  .product-name {
    font-size: clamp(16px, 1.8vw, 22px);
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.02em;
  }
  .product-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .product-subtitle {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ── DISCOUNT BADGE ── */
  .discount-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    background: var(--discount-bg);
    border: 1px solid var(--discount-border);
    font-size: 13px;
    font-weight: 600;
    color: var(--discount-text);
    letter-spacing: 0.01em;
  }
  .discount-badge.hidden { display: none; }
  .discount-label {
    font-weight: 400;
    color: rgba(52, 211, 153, 0.7);
    font-size: 12px;
  }
  .delivery-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(251, 191, 36, 0.08);
    border: 1px solid rgba(251, 191, 36, 0.25);
    font-size: 13px;
    font-weight: 600;
    color: #fbbf24;
    letter-spacing: 0.01em;
  }
  .delivery-badge.hidden { display: none; }
  .delivery-label {
    font-weight: 400;
    color: rgba(251, 191, 36, 0.7);
    font-size: 12px;
  }

  /* ── MATRIX ── */
  .product-intro {
    padding: 4px 20px 4px;
  }
  .product-intro:empty { display: none; }
  .intro-card {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    line-height: 1.55;
  }
  .intro-icon {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(74, 158, 255, 0.15);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 700;
    font-style: italic;
    margin-top: 1px;
  }
  .intro-body { flex: 1; }
  .intro-body p { margin: 0 0 6px 0; }
  .intro-body p:last-child { margin-bottom: 0; }
  .intro-body strong, .intro-body b { color: var(--text); font-weight: 600; }
  .intro-body ul { margin: 0 0 8px 0; padding-left: 20px; list-style: none; }
  .intro-body ul:last-child { margin-bottom: 0; }
  .intro-body li {
    margin-bottom: 3px;
    position: relative;
  }
  .intro-body li::before {
    content: '›';
    position: absolute;
    left: -14px;
    color: var(--accent);
    font-weight: 700;
  }
  /* ── STATIC INFO (Aktuální tab) ── */
  .static-info-section {
    padding: 12px 20px 24px;
    max-width: 860px;
  }
  .static-info-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 28px 22px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .static-info-card .md-h {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    margin: 22px 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .static-info-card p { margin: 0 0 8px; color: var(--text-muted); }
  .static-info-card strong, .static-info-card b { color: var(--text); font-weight: 600; }
  .static-info-card ul { margin: 0 0 8px; padding-left: 20px; list-style: none; }
  .static-info-card li { margin-bottom: 6px; position: relative; color: var(--text-muted); }
  .static-info-card li::before {
    content: '›';
    position: absolute;
    left: -14px;
    color: var(--accent);
    font-weight: 700;
  }

  /* ── KUSOVÉ POLOŽKY (unit list tab) ──
     Scoped overrides: the global th/td rules are tuned for the price matrix
     (sticky 44px first column, centred, nowrap) and would break this table. */
  .unit-list-section { padding: 12px 20px 24px; }
  .unit-list-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 6px 8px;
    width: fit-content;
    max-width: 100%;
  }
  .unit-table thead th,
  .unit-table thead th:first-child {
    position: sticky;
    top: 0;
    left: auto;
    z-index: 5;
    width: auto;
    min-width: 0;
    background: var(--bg-surface);
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-align: left;
    padding: 10px 14px 8px;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }
  .unit-table td {
    min-width: 0;
    padding: 7px 14px;
    border-right: none;
    font-size: 14px;
    text-align: left;
    cursor: default;
  }
  /* beats the global `tr:last-child th { border-bottom: none }` (thead has one row) */
  .unit-table thead tr th { border-bottom: 1px solid var(--border); }
  .unit-table th.num, .unit-table td.num { text-align: right; }
  .unit-table td.unit-sku {
    font-size: 12px;
    color: var(--text-dim);
    user-select: text;
  }
  .unit-table td.unit-name {
    color: var(--text);
    white-space: normal;
    min-width: 280px;
    max-width: 460px;
    user-select: text;
  }
  .unit-table td.unit-price,
  .unit-table td.unit-cost {
    cursor: pointer;
    transition: background 0.1s ease;
  }
  .unit-table td.unit-price { color: #fff; font-weight: 600; }
  .unit-table td.unit-cost { color: #f97316; font-weight: 500; }
  .unit-table td.unit-price:hover,
  .unit-table td.unit-cost:hover { background: rgba(74, 158, 255, 0.18); }
  .unit-table td.copied { background: var(--copied-flash) !important; }
  .unit-table tr.unit-cat-row td {
    padding: 18px 14px 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
  }
  .unit-table tbody:first-of-type tr.unit-cat-row td { padding-top: 12px; }

  /* ── SURCHARGES (separate section) ── */
  .surcharge-section {
    padding: 12px 20px 0;
  }
  .surcharge-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 20px;
  }
  .surcharge-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .surcharge-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 10px;
  }
  .surcharge-item {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    background: rgba(74, 158, 255, 0.10);
    border: 1px solid rgba(74, 158, 255, 0.25);
    border-radius: 6px;
    padding: 7px 14px;
  }
  .surcharge-label { color: var(--text-muted); font-size: 14px; }
  .surcharge-value {
    color: var(--accent);
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    white-space: nowrap;
  }

  .matrix-section {
    padding: 10px 20px 0;
  }
  .tariff-section {
    padding: 8px 20px 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, max-content));
    gap: 12px;
    align-items: start;
  }
  .tariff-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: 'DM Sans', sans-serif;
  }
  .tariff-card .tariff-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .tariff-card .tariff-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .tariff-flat {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .tariff-percent {
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
    background: var(--bg-elevated);
    transition: background 0.1s ease;
    display: inline-block;
    min-width: 56px;
    text-align: center;
  }
  .tariff-percent:hover { background: rgba(74, 158, 255, 0.18); color: var(--accent); }
  .tariff-percent.copied { background: var(--copied-flash); color: var(--accent); }
  .tariff-applies-list {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    line-height: 1.4;
  }
  .tariff-table {
    border-collapse: collapse;
    width: 100%;
  }
  .tariff-table th, .tariff-table td {
    padding: 5px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border-subtle);
  }
  .tariff-table tr:last-child td { border-bottom: none; }
  .tariff-table th {
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding-bottom: 6px;
  }
  .tariff-table td.tariff-price {
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .tariff-table td.tariff-cell {
    width: 1%;
    padding-right: 12px;
    padding-left: 12px;
  }
  .tariff-table td.tariff-cell .tariff-percent {
    font-size: 13px;
    padding: 3px 8px;
    min-width: 48px;
  }
  .matrix-wrap {
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-surface);
    position: relative;
    max-height: calc(100vh - 180px);
    width: fit-content;
    max-width: 100%;
  }
  .matrix-wrap.compact {
    display: inline-block;
    max-width: 100%;
    margin: 0;
  }
  .matrix-wrap.compact .corner-label {
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 6px 8px;
  }
  .matrix-wrap.compact thead th:first-child {
    min-width: 70px;
    width: 70px;
  }
  .matrix-wrap::-webkit-scrollbar { width: 8px; height: 8px; }
  .matrix-wrap::-webkit-scrollbar-track { background: var(--bg-surface); }
  .matrix-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .matrix-wrap::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  .matrix-wrap::-webkit-scrollbar-corner { background: var(--bg-surface); }

  table {
    border-collapse: separate;
    border-spacing: 0;
    width: max-content;
    max-width: 100%;
  }

  th, td {
    padding: 0;
    border-right: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  th:last-child, td:last-child { border-right: none; }
  tr:last-child td, tr:last-child th { border-bottom: none; }

  thead th:first-child {
    position: sticky;
    top: 0;
    left: 0;
    z-index: 30;
    background: var(--corner-bg);
    min-width: 44px;
    width: 44px;
  }

  thead th {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--header-bg);
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(11px, 1vw, 13px);
    font-weight: 600;
    color: #c8cbda;
    padding: 5px 6px;
    white-space: nowrap;
    user-select: none;
  }
  thead th.col-highlight {
    background: var(--highlight-head) !important;
    color: #fff !important;
  }

  tbody th {
    position: sticky;
    left: 0;
    z-index: 10;
    background: var(--header-bg);
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(11px, 1vw, 13px);
    font-weight: 600;
    color: #c8cbda;
    padding: 5px 8px;
    text-align: right;
    white-space: nowrap;
    user-select: none;
    min-width: 48px;
    width: 48px;
  }
  tbody th.row-highlight {
    background: var(--highlight-head) !important;
    color: #fff !important;
  }

  td {
    font-family: 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(11px, 1vw, 13px);
    font-weight: 400;
    color: #f0f1f5;
    padding: 4px 7px;
    cursor: pointer;
    transition: background 0.06s ease;
    white-space: nowrap;
    user-select: none;
    min-width: 36px;
  }

  /* Zebra rows — on <tr>, so stojna/zip tints on <td> still layer on top */
  tbody tr:nth-child(even) { background: var(--zebra); }

  /* Matrix footer row (e.g. lamela counts) */
  tfoot.matrix-footer td.footer-cell {
    font-family: 'Inter', sans-serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(10px, 1vw, 12px);
    color: #7a8499;
    text-align: center;
    padding: 6px 6px;
    border-top: 1px solid var(--border);
    background: rgba(74, 158, 255, 0.04);
    cursor: default;
  }
  tfoot.matrix-footer th.footer-label {
    font-family: 'Inter', sans-serif;
    font-style: italic;
    font-size: clamp(9px, 0.9vw, 11px);
    color: #7a8499;
    text-align: right;
    padding: 6px 8px;
    border-top: 1px solid var(--border);
    background: rgba(74, 158, 255, 0.04);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  /* Stojna zones — must be BEFORE highlights so highlights win */
  td.stojna-3 { background: rgba(245, 200, 40, 0.32); }   /* amber/yellow */
  td.stojna-4 { background: rgba(239, 68, 68, 0.40); }    /* strong red */
  td.stojna-5 { background: rgba(139, 92, 246, 0.42); }   /* violet */
  td.stojna-6 { background: rgba(34, 211, 238, 0.38); }   /* cyan */
  td.stojna-7 { background: rgba(34, 197, 94, 0.30); }    /* green — 2× + příčky */
  td.stojna-8 { background: rgba(236, 72, 153, 0.38); }   /* pink — any other combination */
  thead th.stojna-3 { color: #fde047; background: rgba(245, 200, 40, 0.28); }
  thead th.stojna-4 { color: #fca5a5; background: rgba(239, 68, 68, 0.32); }

function parseFirstNum(val) {
  if (typeof val === 'number') return val;
  const m = String(val).match(/\d+/);
  return m ? parseInt(m[0]) : 0;
}

// Tiny markdown → HTML (paragraphs, bullets, bold)
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function mdInline(s) {
  return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
function mdToHtml(md) {
  const lines = md.split('\n');
  const out = [];
  let inList = false;
  let para = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(mdInline).join(' ')}</p>`); para = []; } };
  const flushList = () => { if (inList) { out.push('</ul>'); inList = false; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    const heading = line.match(/^(#{2,4})\s+(.*)$/);
    const bullet = line.match(/^[-*]\s+(.*)$/);
    const quote = line.match(/^>\s?(.*)$/);
    if (heading) {
      flushPara(); flushList();
      out.push(`<h4 class="md-h">${mdInline(heading[2])}</h4>`);
    } else if (bullet) {
      flushPara();
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(`<li>${mdInline(bullet[1])}</li>`);
    } else if (quote) {
      flushPara(); flushList();
      if (quote[1].trim()) out.push(`<p class="md-quote">${mdInline(quote[1])}</p>`);
    } else if (line.trim() === '') {
      flushPara();
      flushList();
    } else {
      flushList();
      para.push(line.trim());
    }
  }
  flushPara();
  flushList();
  return out.join('');
}

// Fetch with retry — GitHub raw CDN occasionally returns transient 5xx/429
// ("Backend.max_conn reached"). Retry a few times with backoff before failing.
async function fetchWithRetry(url, tries = 4) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (r.ok) return r;
      if ([429, 500, 502, 503, 504].includes(r.status) && i < tries - 1) {
        await new Promise(res => setTimeout(res, 500 * (i + 1) * (i + 1)));
        continue;
      }
      throw new Error(`GitHub ${r.status} pro ${url}`);
    } catch (e) {
      lastErr = e;
      if (i < tries - 1) { await new Promise(res => setTimeout(res, 500 * (i + 1) * (i + 1))); continue; }
    }
  }
  throw lastErr || new Error(`Fetch selhal: ${url}`);
}

async function ghFetchJson(url) {
  const r = await fetchWithRetry(url);
  return r.json();
}

async function ghFetchText(url) {
  try { const r = await fetchWithRetry(url); return r.text(); }
  catch (e) { return ''; }
}

// Parse knowledge.md → { sections: [{heading, body}] }
function parseKnowledge(md) {
  if (!md) return { sections: [] };
  const text = md.replace(/^---[\s\S]*?---\s*\n/, '').replace(/^#\s.*\n/m, '').trim();
  const sections = [];
  let current = null;
  for (const line of text.split('\n')) {
    const m = line.match(/^(#{2,3})\s+(.*?)\s*$/);
    if (m) {
      if (current) sections.push(current);
      current = { heading: m[2].trim(), body: '' };
    } else if (current) {
      current.body += line + '\n';
    }
  }
  if (current) sections.push(current);
  return { sections: sections.map(s => ({ heading: s.heading, body: s.body.trim() })), fullBody: text };
}

function findVariantDescription(knowledge, label) {
  if (!knowledge?.sections || !label) return '';
  const norm = s => s.toLowerCase().replace(/[—–-]/g, '-').replace(/\(.*?\)/g, '').trim();
  const target = norm(label);
  for (const sec of knowledge.sections) {
    const h = norm(sec.heading);
    if (h === target || h.includes(target) || target.includes(h)) return sec.body;
  }
  return '';
}

}

const UNIT_LABELS = { m2: 'm²', bm: 'bm', km: 'km' };
const CATEGORY_LABELS = {

const CATEGORY_ORDER = ['prislusenstvi', 'elektro', 'profily', 'vypln', 'sluzba', 'priplatky'];

// Price per unit — ks shows plain Kč, other units get a suffix (30 Kč/km).
function fmtUnitPrice(n, unit) {

  return unit && unit !== 'ks' ? `${base}/${UNIT_LABELS[unit] || unit}` : base;

function makeCopyCell(value, unit, className) {

function renderUnitList(container, items) {
  container.innerHTML = '';
  // Group by category: known categories in a fixed order, unknown ones after.
  const groups = new Map();
  for (const it of items) {
    if (!groups.has(it.category)) groups.set(it.category, []);
    groups.get(it.category).push(it);
  }
  const cats = [...groups.keys()].sort((a, b) => {
    const ia = CATEGORY_ORDER.indexOf(a), ib = CATEGORY_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  const table = document.createElement('table');
  table.className = 'unit-table';
  table.innerHTML = '<thead><tr><th>SKU</th><th>Název</th>'
    + '<th class="num">Prodejní cena</th><th class="num">Náklad</th></tr></thead>';
  for (const cat of cats) {
    const tbody = document.createElement('tbody');
    const head = document.createElement('tr');
    head.className = 'unit-cat-row';
    const headCell = document.createElement('td');
    headCell.colSpan = 4;
    headCell.textContent = CATEGORY_LABELS[cat] || cat;
    head.appendChild(headCell);
    tbody.appendChild(head);
    for (const it of groups.get(cat)) {
      const tr = document.createElement('tr');
      const sku = document.createElement('td');
      sku.className = 'unit-sku';
      sku.textContent = it.sku;
      const name = document.createElement('td');
      name.className = 'unit-name';
      name.textContent = it.name || '';
      tr.append(sku, name,
        makeCopyCell(it.price, it.unit, 'unit-price'),
        makeCopyCell(it.cost, it.unit, 'unit-cost'));
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
  }
  container.appendChild(table);
}

// Build pergola lakování surcharges from their source SKUs.
function buildPergolaSurcharges(items) {
  const out = [];
  const ram = items.find(it => it.sku === 'extra-ral-ram');
  const lamely = items.find(it => it.sku === 'extra-ral-lamely');

    if (m) out.push({ label: ram.name || 'Příplatek lakování rámu', value: `${m[1]} % z ceny` });
  }
  if (lamely) {
    const price = (typeof lamely.standard_price === 'number' && lamely.standard_price > 1)
      ? lamely.standard_price : null;
    if (price) out.push({ label: lamely.name || 'Příplatek lakování lamel', value: `${price} Kč/m²` });
  }
  return out;
}

function ghTransformPrices(raw, sku, knowledge) {
  if (raw.type === 'matrix') {
    return { products: [{ id: sku, sku, order: 0,
      horizontalValues: raw.horizontal_values || [],
      verticalValues:   raw.vertical_values   || [],
      prices:           raw.prices            || [],
      options:          raw.options           || {} }] };
  }
  if (raw.type === 'multi-matrix') {
    return { products: [{ id: sku, sku, order: 0, multiMatrix: true,
      matrices: (raw.variants || []).map(v => ({
        label: v.label,
        description: findVariantDescription(knowledge, v.label),
        horizontalValues: v.horizontal_values || [],
        verticalValues:   v.vertical_values   || [],
        prices:           v.prices            || [],
        options:          v.options           || {} })) }] };
  }
  if (raw.type === 'percent-tariff') {
    return { products: [{ id: sku, sku, order: 0,
      pricingType: 'percent-tariff',
      tariffNote: raw.note || '',
      tariffSections: raw.sections || [] }] };
  }
  return { products: [{ id: sku, sku, order: 0,
    horizontalValues: [], verticalValues: [], prices: [] }] };
}

function ghTransformInfo(meta, sku, name, knowledge) {
  const p = { id: sku, sku, order: 0, name: name || sku,
    horizontalLabel: meta?.axes?.horizontal?.label || 'šířka',
    verticalLabel:   meta?.axes?.vertical?.label   || 'hloubka' };
  if (meta?.horizontal_footer) {
    p.horizontalFooter = { label: meta.horizontal_footer.label, values: meta.horizontal_footer.values };
  }
  if (Array.isArray(meta?.support_zones)) p.supportZones = meta.support_zones;
  p.knowledgeDescription = knowledge?.fullBody || '';
  return { products: [p] };
}

// ─── STOJNA ZONES (pricelist-01 → metadata.json → support_zones) ───
// Ordered rules; the first one whose ranges match wins, no match = 2 stojny
// (no tint). Ranges are inclusive mm: sirka = horizontal axis, hloubka =
// vertical axis; a missing bound means unbounded. Example rule:
//   { "stojny": 3, "pricky": true, "hloubka_od": 4500 }
// Style codes (CSS .stojna-N): 3 = 3×, 4 = 4×, 5 = 3× + příčky,
// 6 = 4× + příčky, 7 = 2× + příčky, 8 = any other combination.
function zoneCode(stojny, pricky) {
  if (!pricky && stojny <= 2) return 2;
  if (stojny === 2) return 7;
  if (stojny === 3) return pricky ? 5 : 3;
  if (stojny === 4) return pricky ? 6 : 4;
  return 8;
}

// rules → { fn(w, h) → style code, labels: { code → legend text } }, or null.
// Malformed rules (no stojny, non-numeric bound) are skipped.
function compileSupportZones(rules) {
  if (!Array.isArray(rules)) return null;
  const num = v => (v == null || v === '' ? null : Number(v));
  const inRange = (v, from, to) => (from == null || v >= from) && (to == null || v <= to);
  const compiled = [];
  for (const r of rules) {
    const stojny = Number(r && r.stojny);
    const b = [num(r.sirka_od), num(r.sirka_do), num(r.hloubka_od), num(r.hloubka_do)];
    if (!Number.isFinite(stojny) || b.some(x => Number.isNaN(x))) continue;
    compiled.push({
      code: zoneCode(stojny, !!r.pricky),
      test: (w, h) => inRange(w, b[0], b[1]) && inRange(h, b[2], b[3]),
      label: r.popisek || `${stojny}× stojna${r.pricky ? ' + příčky mezi krokvemi' : ''}`,
    });
  }
  if (!compiled.length) return null;
  const labels = {};
  for (const c of compiled) if (c.code > 2 && !labels[c.code]) labels[c.code] = c.label;
  return { fn: (w, h) => { const hit = compiled.find(c => c.test(w, h)); return hit ? hit.code : 2; }, labels };
}

function resolveZones(product) {
  return compileSupportZones(product.supportZones);
}

// ─── LOAD CATALOG + PRICE & INFO FILES ───
async function loadCatalog() {
  try {
    if (IS_LOCAL) {
      // Local mode: fetch through the proxy server (already transformed)
      catalog = await fetch('../data/catalog.json').then(r => r.json());
    } else {
      // GitHub Pages mode: fetch pricelist.json + metadata, build catalog
      const items = await ghFetchJson(`${GH_RAW}/pricelist.json`);
      const matrixItems = items.filter(it => it.price_formula === 'matrix');
      const montazItem = items.find(it => it.sku === 'montaz'
        && typeof it.price_formula === 'string'
        && it.price_formula.startsWith('percent-tariff'));
      const montazScreen = items.find(it => it.sku === 'montaz-screen');
      const montazScreenPrice = (montazScreen && typeof montazScreen.standard_price === 'number'
        && montazScreen.standard_price > 1) ? montazScreen.standard_price : null;
      const bioSurcharges = buildPergolaSurcharges(items);
      const metas = await Promise.all(matrixItems.map(it =>
        ghFetchJson(`${GH_RAW}/products/${it.category}/${it.sku}/metadata.json`).catch(() => null)
      ));
      const matrixProducts = matrixItems.map((it, i) => ({
        id: it.sku,
        name: it.name,
        displayName: metas[i]?.display_name_cs || it.name,
        folder: it.sku,
        category: it.category,
        discount: it.discount || '',
        costPercent: it.cost_percent || 0,
        deliveryWeeks: it.delivery_weeks || '',
        deliveryNote: '',
        description: it.description || '',
        montazFixed: it.sku === 'alux-screen' ? montazScreenPrice : null
      }));
      // Bottom-bar montáž rates from montaz/prices.json (installation_rates)
      let installationRates = DEFAULT_RATES;
      if (montazItem) {
        const mp = await ghFetchJson(`${GH_RAW}/products/${montazItem.category}/montaz/prices.json`).catch(() => null);
        if (mp && Array.isArray(mp.installation_rates) && mp.installation_rates.length) {
          installationRates = mp.installation_rates;
        }
      }
      const products = [];
      if (montazItem) {
        products.push({
          id: 'montaz',
          name: 'Montáž + příplatky',
          displayName: 'Montáž + příplatky',
          folder: 'montaz',
          category: montazItem.category,
          pricingType: 'percent-tariff',
          discount: '',
          costPercent: 0,
          deliveryWeeks: '',
          deliveryNote: '',
          description: montazItem.description || '',
          surcharges: bioSurcharges
        });
      }
      products.push(...matrixProducts);
      catalog = { installationRates, products, kusove: pickKusove(items) };
    }

    // Fetch prices.json and info.json for each product
    const fetches = catalog.products.map(async entry => {
      let priceData, infoData;

      if (IS_LOCAL) {
        [priceData, infoData] = await Promise.all([
          fetch(`../data/${entry.folder}/prices.json`).then(r => r.json()),
          fetch(`../data/${entry.folder}/info.json`).then(r => r.json())
        ]);
      } else {
        const cat = entry.category;
        const [rawPrices, rawMeta, rawKnow] = await Promise.all([
          ghFetchJson(`${GH_RAW}/products/${cat}/${entry.id}/prices.json`),
          ghFetchJson(`${GH_RAW}/products/${cat}/${entry.id}/metadata.json`).catch(() => null),
          ghFetchText(`${GH_RAW}/products/${cat}/${entry.id}/knowledge.md`)
        ]);
        const knowledge = parseKnowledge(rawKnow);
        priceData = ghTransformPrices(rawPrices, entry.id, knowledge);
        infoData  = ghTransformInfo(rawMeta, entry.id, entry.name, knowledge);
      }

      const prices = priceData.products.find(p => p.id === entry.id);
      const info = infoData.products.find(p => p.id === entry.id);
      return {
        ...prices,
        ...info,
        catalogName: entry.name,
        displayName: entry.displayName || entry.name,
        description: entry.description || info?.description || '',
        discountRaw: entry.discount ?? '',
        discount: parseFirstNum(entry.discount),
        costPercent: entry.costPercent || 0,
        deliveryWeeks: entry.deliveryWeeks || '',
        deliveryNote: entry.deliveryNote || '',
        montazFixed: entry.montazFixed ?? null,
        surcharges: entry.surcharges ?? null
      };
    });

    allProducts = await Promise.all(fetches);

    // Prepend static info tab (business info for sales — not from pricelist)
    allProducts.unshift({
      id: 'aktualni',
      catalogName: 'Aktuální',
      name: 'Aktuální',
      displayName: 'Aktuální obchodní podmínky',
      pricingType: 'static-info',
      staticContent: STATIC_INFO_MD,
    });

    // Fixed-price items that also appear in a nav group (see NAV_FIXED_ITEMS)
    for (const sku of NAV_FIXED_ITEMS) {
      const item = (catalog.kusove || []).find(k => k.sku === sku);
      if (!item) continue;
      allProducts.push({
        id: item.sku,
        catalogName: item.name,
        name: item.name,
        displayName: item.name,
        pricingType: 'unit-list',
        unitItems: [item],
      });
    }

    // Append fixed-price items tab at the end of the navigation
    if (catalog.kusove && catalog.kusove.length) {
      allProducts.push({
        id: 'kusove-polozky',
        catalogName: 'Kusové položky',
        name: 'Kusové položky',
        displayName: 'Kusové položky',
        pricingType: 'unit-list',
        unitItems: catalog.kusove,
      });
    }

    buildNav(allProducts);
    buildInstallGroups();

    // After an auto-refresh, land back on the product the user was viewing.
    const restore = takeRestoreState();
    const initial = (restore && allProducts.find(p => p.id === restore.tab)) || allProducts[0];
    setActiveNav(initial.id);
    showProduct(initial);
    if (restore) showToast('Ceník aktualizován na novou verzi');
  } catch (err) {
    document.getElementById('productName').textContent = 'Data se nepodařilo načíst';
    document.getElementById('productIntro').innerHTML =
      `<div class="intro-card"><div class="intro-icon">!</div><div class="intro-body">` +
      `<p>Zdroj cen (GitHub) je momentálně nedostupný nebo přetížený.</p>` +
      `<p style="color:var(--text-dim);font-size:12px">${err.message}</p>` +
      `<button onclick="location.reload()" style="margin-top:10px;padding:8px 18px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer">Zkusit znovu</button>` +
      `</div></div>`;
  }
}

// ─── BADGES ───
function updateBadges(product) {
  const discBadge = document.getElementById('discountBadge');
  const discValue = document.getElementById('discountValue');
  const rawDisc = String(product.discountRaw ?? product.discount ?? '');
  if (rawDisc && rawDisc !== '0') {
    discBadge.classList.remove('hidden');
    discValue.textContent = rawDisc.includes('%') ? rawDisc : `−${rawDisc}%`;
  } else {
    discBadge.classList.add('hidden');
  }

  const delBadge = document.getElementById('deliveryBadge');
  const delValue = document.getElementById('deliveryValue');
  if (product.deliveryWeeks) {
    delBadge.classList.remove('hidden');
    let delText = `${product.deliveryWeeks} týdnů`;
    if (product.deliveryNote) delText += ` · ${product.deliveryNote}`;
    delValue.textContent = delText;
  } else {
    delBadge.classList.add('hidden');
  }
}

// ─── INSTALL RATE FIELDS ───
function buildInstallGroups(product) {
  const group = document.getElementById('selInstallGroup');
  group.innerHTML = '';

  // Fixed montáž (e.g. screen — flat CZK from montaz-screen, not a percentage)
  if (product && product.montazFixed != null) {
    const label = document.createElement('span');
    label.className = 'sel-label';
    label.textContent = 'Montáž';
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'sel-value sel-install';
    input.readOnly = true;
    input.setAttribute('data-fixed', product.montazFixed);
    input.addEventListener('click', () => copyFromInput(input));
    group.appendChild(label);
    group.appendChild(input);
    return;
  }

  // Percentage rates (default for everything else)
  catalog.installationRates.forEach(rate => {
    const label = document.createElement('span');
    label.className = 'sel-label';
    label.textContent = `Montáž +${rate}%`;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'sel-value sel-install';
    input.readOnly = true;
    input.setAttribute('data-rate', rate);
    input.addEventListener('click', () => copyFromInput(input));
    group.appendChild(label);
    group.appendChild(input);
  });
}

// ─── NAV ───
// Products are grouped by product line so the bar stays short. A group with
// one product renders as a plain tab; bigger groups open a dropdown on tap
// (no hover), so it behaves the same on phones, tablets and desktop.
// Nav layout between the leading tabs (Aktuální, Montáž) and Kusové položky.
// A slot with a label is a dropdown group; a slot without one is a single
// standalone product. A group left with one product renders as a plain tab.
// `order` pins the order of the products inside a dropdown.
const NAV_SLOTS = [
  { key: 'alux',          label: 'ALUX pergoly' },
  { key: 'strada',        label: 'Strada pergoly' },
  { key: 'simple-ancona' },
  { key: 'zaskleni',      label: 'Zasklení' },
  { key: 'alux-screen' },
  { key: 'markyzy',       label: 'Markýzy' },
  { key: 'vyplne',        label: 'Výplně',
    order: ['alux-blind', 'lamely-venys', 'vypln-slunolam-fix', 'pur-panel-stena'] },
];

// Fixed-price items that also sit in a nav group (fixní slunolam under
// Výplně). They reuse the Kusové položky view showing just their own row.
const NAV_FIXED_ITEMS = ['vypln-slunolam-fix'];

// Which slot a product belongs to. Standalone products first, then specific
// groups before the broad alux-/strada- prefixes (ALUX screen/zasklení/blind
// would otherwise land in "ALUX pergoly"). null = no slot: the product still
// gets a plain tab after the slots, so nothing ever disappears.
function navSlotOf(p) {
  const id = p.id || '';
  if (id === 'simple-ancona' || id === 'alux-screen') return id;
  if (id.includes('zaskleni')) return 'zaskleni';
  if (id.startsWith('markyza')) return 'markyzy';
  if (/blind|slunolam|venys|pur-panel/.test(id)) return 'vyplne';
  if (id.startsWith('alux-')) return 'alux';
  if (id.startsWith('strada-')) return 'strada';
  return null;
}

let navItems = [];          // [{ el, productIds }] — drives the active state
let openNavGroupBtn = null;

function setActiveNav(productId) {
  navItems.forEach(({ el, productIds }) =>
    el.classList.toggle('active', productIds.includes(productId)));
}

function selectProduct(p) {
  closeNavDropdown();
  setActiveNav(p.id);
  showProduct(p);
  document.getElementById('selectionBar').classList.remove('visible');
}

function makeNavTab(product) {
  const tab = document.createElement('button');
  tab.type = 'button';
  tab.className = 'nav-tab';
  tab.textContent = product.catalogName || product.name;
  tab.addEventListener('click', () => selectProduct(product));
  navItems.push({ el: tab, productIds: [product.id] });
  return tab;
}

function makeNavSep() {
  const sep = document.createElement('div');
  sep.className = 'nav-sep';
  return sep;
}

function buildNav(products) {
  const bar = document.getElementById('topBar');
  bar.innerHTML = '';
  navItems = [];
  closeNavDropdown();

  const logo = document.createElement('img');
  logo.src = '../files/alux-logo.png';
  logo.className = 'top-logo';
  logo.alt = 'ALUX';
  bar.appendChild(logo);

  const divider = document.createElement('div');
  divider.className = 'top-logo-divider';
  bar.appendChild(divider);

  const isLeading = p => p.pricingType === 'static-info' || p.pricingType === 'percent-tariff';
  const isTrailing = p => p.id === 'kusove-polozky';
  const leading = products.filter(isLeading);
  const trailing = products.filter(isTrailing);
  const grouped = products.filter(p => !isLeading(p) && !isTrailing(p));

  leading.forEach(p => bar.appendChild(makeNavTab(p)));
  if (leading.length && grouped.length) bar.appendChild(makeNavSep());

  for (const slot of NAV_SLOTS) {
    let members = grouped.filter(p => navSlotOf(p) === slot.key);
    if (!members.length) continue;
    if (slot.order) {
      const rank = id => { const i = slot.order.indexOf(id); return i < 0 ? slot.order.length : i; };
      members = [...members].sort((a, b) => rank(a.id) - rank(b.id));
    }
    if (!slot.label || members.length === 1) { members.forEach(p => bar.appendChild(makeNavTab(p))); continue; }

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'nav-tab nav-group';
    btn.setAttribute('aria-haspopup', 'true');
    btn.setAttribute('aria-expanded', 'false');
    btn.innerHTML = `<span>${slot.label}</span><span class="nav-chevron" aria-hidden="true"></span>`;
    btn.addEventListener('click', () => {
      if (openNavGroupBtn === btn) closeNavDropdown();
      else openNavDropdown(btn, members);
    });
    navItems.push({ el: btn, productIds: members.map(p => p.id) });
    bar.appendChild(btn);
  }

  // Products no slot claims still get a tab — nothing ever disappears.
  grouped.filter(p => navSlotOf(p) === null).forEach(p => bar.appendChild(makeNavTab(p)));

  if (trailing.length && grouped.length) bar.appendChild(makeNavSep());
  trailing.forEach(p => bar.appendChild(makeNavTab(p)));

  // Admin toggle button
  const adminBtn = document.createElement('div');
  adminBtn.className = 'admin-toggle';
  adminBtn.id = 'adminToggle';
  adminBtn.innerHTML = '⚙ Nastavení';
  adminBtn.addEventListener('click', toggleAdmin);
  bar.appendChild(adminBtn);

  if (products.length) setActiveNav(products[0].id);
}

// ─── NAV DROPDOWN ───
// One shared panel on <body>: the top bar scrolls horizontally with
// overflow hidden, so a panel inside it would get clipped.
function getNavDropdown() {
  let panel = document.getElementById('navDropdown');
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'navDropdown';
    panel.className = 'nav-dropdown';
    panel.setAttribute('role', 'menu');
    document.body.appendChild(panel);
  }
  return panel;
}

function openNavDropdown(btn, members) {
  closeNavDropdown();
  const panel = getNavDropdown();
  panel.innerHTML = '';
  const activeId = currentProduct && currentProduct.id;
  for (const p of members) {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'nav-dropdown-item' + (p.id === activeId ? ' active' : '');
    item.setAttribute('role', 'menuitem');
    item.textContent = p.catalogName || p.name;
    item.addEventListener('click', () => selectProduct(p));
    panel.appendChild(item);
  }
  panel.classList.add('open');
  btn.classList.add('open');
  btn.setAttribute('aria-expanded', 'true');
  openNavGroupBtn = btn;
  positionNavDropdown();
}

function positionNavDropdown() {
  if (!openNavGroupBtn) return;
  const panel = getNavDropdown();
  const r = openNavGroupBtn.getBoundingClientRect();
  const bar = document.getElementById('topBar').getBoundingClientRect();
  // Button swiped fully out of the bar's visible area → the panel would float
  // detached from anything, so close it.
  if (r.right <= bar.left || r.left >= bar.right) { closeNavDropdown(); return; }
  if (window.innerWidth < 640) {          // phones: full-width sheet under the bar
    panel.style.top = `${Math.round(bar.bottom + 4)}px`;
    panel.style.left = '8px';
    panel.style.right = '8px';
  } else {                                // under the button, kept on screen
    panel.style.top = `${Math.round(r.bottom + 4)}px`;
    panel.style.right = 'auto';
    const left = Math.min(Math.max(8, r.left), window.innerWidth - panel.offsetWidth - 8);
    panel.style.left = `${Math.round(left)}px`;
  }
}

function closeNavDropdown() {
  const panel = document.getElementById('navDropdown');
  if (panel) panel.classList.remove('open');
  if (openNavGroupBtn) {
    openNavGroupBtn.classList.remove('open');
    openNavGroupBtn.setAttribute('aria-expanded', 'false');
  }
  openNavGroupBtn = null;
}

// Close on outside tap or Escape. Nav scroll and resize only reposition the
// panel: tapping a half-visible button can make the browser scroll the bar,
// and closing on that would make the dropdown vanish right after opening.
document.addEventListener('pointerdown', (e) => {
  if (!openNavGroupBtn) return;
  const panel = document.getElementById('navDropdown');
  if ((panel && panel.contains(e.target)) || openNavGroupBtn.contains(e.target)) return;
  closeNavDropdown();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNavDropdown(); });
document.getElementById('topBar').addEventListener('scroll', positionNavDropdown, { passive: true });
window.addEventListener('resize', positionNavDropdown);

// ─── RENDER PRODUCT ───
// ─── TARIFF (MONTÁŽ) RENDERER ───
function fmtCzk(n) {
  return n == null ? '∞' : new Intl.NumberFormat('cs-CZ').format(n) + ' Kč';
}

function makePercentChip(percent) {
  const pct = document.createElement('span');
  pct.className = 'tariff-percent';
  pct.textContent = `${percent} %`;
  pct.title = 'Klikni pro zkopírování';
  pct.addEventListener('click', () => {
    copyToClipboard(String(percent));
    showToast(`Zkopírováno: ${percent} %`);
    pct.classList.add('copied');
    setTimeout(() => pct.classList.remove('copied'), 400);
  });
  return pct;
}

function renderTariffView(container, product) {
  container.innerHTML = '';
  const sections = product.tariffSections || [];

  sections.forEach(sec => {
    const card = document.createElement('div');
    card.className = 'tariff-card';

    const title = document.createElement('div');
    title.className = 'tariff-title';
    title.textContent = sec.label || sec.id;
    card.appendChild(title);

    if (sec.rate_type === 'flat_percent') {
      if (sec.applies_to_skus?.length) {
        const sub = document.createElement('div');
        sub.className = 'tariff-sub';
        sub.textContent = sec.applies_to_skus.join(' · ');
        card.appendChild(sub);
      }
      const flat = document.createElement('div');
      flat.className = 'tariff-flat';
      flat.appendChild(makePercentChip(sec.percent));
      card.appendChild(flat);
    } else if (sec.rate_type === 'tiered_by_price') {
      if (sec.tier_note) {
        const sub = document.createElement('div');
        sub.className = 'tariff-sub';
        sub.textContent = sec.tier_note;
        card.appendChild(sub);
      }
      const table = document.createElement('table');
      table.className = 'tariff-table';
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>Cena produktu do</th><th>Sazba</th></tr>';
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      (sec.tiers || []).forEach(t => {
        const tr = document.createElement('tr');
        const tdPrice = document.createElement('td');
        tdPrice.className = 'tariff-price';
        tdPrice.textContent = t.price_up_to_czk == null
          ? (t.note || 'a více')
          : fmtCzk(t.price_up_to_czk);
        const tdPct = document.createElement('td');
        tdPct.className = 'tariff-cell';
        tdPct.appendChild(makePercentChip(t.percent));
        tr.appendChild(tdPrice);
        tr.appendChild(tdPct);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      card.appendChild(table);
    }

    container.appendChild(card);
  });
}

function showProduct(product) {
  currentProduct = product;
  document.getElementById('productName').textContent = product.displayName || product.catalogName || product.name;
  updateBadges(product);

  const staticInfoSection = document.getElementById('staticInfoSection');
  const unitListSection = document.getElementById('unitListSection');

  // STATIC INFO view (Aktuální) — pure business text, no pricing
  if (product.pricingType === 'static-info') {
    document.getElementById('productIntro').innerHTML = '';
    document.getElementById('matrixSection').style.display = 'none';
    document.getElementById('tariffSection').style.display = 'none';
    document.querySelector('.tech-section').style.display = 'none';
    document.getElementById('surchargeSection').style.display = 'none';
    document.getElementById('selectionBar').classList.remove('visible');
    document.getElementById('mainContent').classList.remove('bar-visible');
    document.getElementById('productSubtitle').textContent = 'Interní informace pro obchodníky';
    document.getElementById('staticInfoContent').innerHTML = mdToHtml(product.staticContent || '');
    unitListSection.style.display = 'none';
    staticInfoSection.style.display = '';
    return;
  }
  staticInfoSection.style.display = 'none';

  // UNIT LIST view (Kusové položky) — fixed per-unit prices, no matrix
  if (product.pricingType === 'unit-list') {
    document.getElementById('productIntro').innerHTML = '';
    document.getElementById('matrixSection').style.display = 'none';
    document.getElementById('tariffSection').style.display = 'none';
    document.querySelector('.tech-section').style.display = 'none';
    document.getElementById('surchargeSection').style.display = 'none';
    document.getElementById('selectionBar').classList.remove('visible');
    document.getElementById('mainContent').classList.remove('bar-visible');
    const n = product.unitItems.length;
    const polozek = n === 1 ? 'položka' : (n >= 2 && n <= 4 ? 'položky' : 'položek');
    document.getElementById('productSubtitle').textContent =
      `${n} ${polozek} s pevnou cenou — klikni na cenu pro zkopírování`;
    renderUnitList(document.getElementById('unitListContent'), product.unitItems);
    unitListSection.style.display = '';
    return;
  }
  unitListSection.style.display = 'none';

  const introEl = document.getElementById('productIntro');
  introEl.innerHTML = product.description
    ? `<div class="intro-card"><div class="intro-icon">i</div><div class="intro-body">${mdToHtml(product.description)}</div></div>`
    : '';

  // Surcharges — separate section
  const surchargeSection = document.getElementById('surchargeSection');
  const surchargeList = document.getElementById('surchargeList');
  if (product.surcharges && product.surcharges.length) {
    surchargeList.innerHTML = product.surcharges.map(s =>
      `<div class="surcharge-item"><span class="surcharge-label">${s.label}</span><span class="surcharge-value">${s.value}</span></div>`
    ).join('');
    surchargeSection.style.display = '';
  } else {
    surchargeList.innerHTML = '';
    surchargeSection.style.display = 'none';
  }

  // Bottom: general product description from knowledge.md "## Popis"
  const techSection = document.querySelector('.tech-section');
  const techEl = document.getElementById('techDescription');
  if (product.knowledgeDescription) {
    techEl.innerHTML = mdToHtml(product.knowledgeDescription);
    techSection.style.display = '';
  } else {
    techEl.innerHTML = '';
    techSection.style.display = 'none';
  }

  // PERCENT-TARIFF view (Montáž) — render and return early
  const matrixSectionEl = document.getElementById('matrixSection');
  const tariffSectionEl = document.getElementById('tariffSection');
  if (product.pricingType === 'percent-tariff') {
    matrixSectionEl.style.display = 'none';
    tariffSectionEl.style.display = '';
    document.getElementById('selectionBar').classList.remove('visible');
    document.getElementById('mainContent').classList.remove('bar-visible');
    document.getElementById('productSubtitle').textContent =
      `${(product.tariffSections || []).length} sazeb — klikni na procento pro zkopírování`;
    renderTariffView(tariffSectionEl, product);
    return;
  }
  matrixSectionEl.style.display = '';
  tariffSectionEl.style.display = 'none';

  // Rebuild helper-bar montáž fields for this product (fixed vs percentage)
  buildInstallGroups(product);

  // Normalize: every product is an array of sections
  let sections = product.multiMatrix
    ? product.matrices
    : [{ label: null, horizontalValues: product.horizontalValues, verticalValues: product.verticalValues, prices: product.prices, options: product.options || {} }];

  // Per-product depth cap: hide rows above a max hloubka (e.g. ALUX Thermo ≤ 5500 mm)
  const maxDepthRules = { 'alux-thermo': 5500 };
  const maxDepth = maxDepthRules[product.id];
  if (maxDepth != null) {
    sections = sections.map(sec => {
      const idx = [];
      sec.verticalValues.forEach((h, i) => { if (h <= maxDepth) idx.push(i); });
      const newOptions = {};
      if (sec.options) {
        for (const k of Object.keys(sec.options)) {
          const arr = sec.options[k];
          newOptions[k] = Array.isArray(arr) ? idx.map(i => arr[i]) : arr;
        }
      }
      return {
        ...sec,
        verticalValues: idx.map(i => sec.verticalValues[i]),
        prices: idx.map(i => sec.prices[i]),
        options: sec.options ? newOptions : sec.options,
      };
    });
  }

  const hLabel = product.horizontalLabel || 'šířka';
  const vLabel = product.verticalLabel || 'výška';
  const isScreen = product.id === 'alux-screen';
  const screenHighlight = { 2400: 'zip-row-a', 2500: 'zip-row-b', 2600: 'zip-row-c' };
  const isZaskleni = product.id?.startsWith('alux-zaskleni');
  const zaskleniHighlight = { 2400: 'zip-row-a', 2500: 'zip-row-b', 2600: 'zip-row-c' };
  // Stojna zones come from the pricelist (metadata.json → support_zones)
  const zoneSpec = resolveZones(product);
  const stojnaFn = zoneSpec ? zoneSpec.fn : null;

  // Option column labels (for option keys in variant.options)
  const optionLabels = {
    top_cover: 'Horní kryt',
    vario_valance_crank: 'Vario Valance (klika)',
    vario_valance_motor: 'Vario Valance (motor)',
    atypicka_ral: 'Atypická RAL',
    atypicka_barva: 'Atypická barva',
    motor_io_upgrade: 'Motor IO',
  };

  // Subtitle
  if (sections.length > 1) {
    const totalCells = sections.reduce((s, m) => s + m.verticalValues.length * m.horizontalValues.length, 0);
    document.getElementById('productSubtitle').textContent = `${sections.length} cenových tabulek — ${totalCells} hodnot`;
  } else {
    const s = sections[0];
    document.getElementById('productSubtitle').textContent = `${hLabel} → × ${vLabel} ↓ — ${s.verticalValues.length} × ${s.horizontalValues.length} hodnot`;
  }

  // Build one table with all sections
  const wrap = document.getElementById('matrixWrap');
  const table = document.getElementById('matrixTable');
  table.style.display = '';
  table.innerHTML = '';
  wrap.querySelectorAll('.multi-matrix-block').forEach(el => el.remove());

  // Compact width only for markyza-lewens-ancona
  if (product.id === 'markyza-lewens-ancona') wrap.classList.add('compact');
  else wrap.classList.remove('compact');

  sections.forEach((sec, si) => {
    // Section options (extra columns appended after price grid)
    const optionKeys = Object.keys(sec.options || {});
    const totalCols = sec.horizontalValues.length + 1 + optionKeys.length;

    // Separator between sections
    if (si > 0) {
      const sep = document.createElement('tbody');
      const r = document.createElement('tr');
      r.className = 'matrix-separator';
      const td = document.createElement('td');
      td.setAttribute('colspan', totalCols);
      r.appendChild(td);
      sep.appendChild(r);
      table.appendChild(sep);
    }

    // Section title row (spans all columns) — only for multi-matrix
    if (sec.label) {
      const titleTbody = document.createElement('tbody');
      titleTbody.className = 'section-title-row';
      const titleTr = document.createElement('tr');
      const titleTh = document.createElement('th');
      titleTh.setAttribute('colspan', totalCols);
      titleTh.className = 'section-title';
      titleTh.textContent = sec.label;
      titleTr.appendChild(titleTh);
      titleTbody.appendChild(titleTr);
      table.appendChild(titleTbody);
    }

    // Header
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    const corner = document.createElement('th');
    corner.innerHTML = `<div class="corner-label"><span>${vLabel} ↓</span><span>${hLabel} →</span></div>`;
    headerRow.appendChild(corner);
    sec.horizontalValues.forEach((w, ci) => {
      const th = document.createElement('th');
      th.textContent = w;
      th.setAttribute('data-col', ci);
      th.setAttribute('data-si', si);
      if (stojnaFn) { const sz = stojnaFn(w, 0); if (sz > 2) th.classList.add('stojna-' + sz); }
      headerRow.appendChild(th);
    });
    optionKeys.forEach(key => {
      const th = document.createElement('th');
      th.className = 'option-header';
      th.textContent = optionLabels[key] || key;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    // Data
    const tbody = document.createElement('tbody');
    tbody.setAttribute('data-si', si);
    sec.verticalValues.forEach((h, ri) => {
      const row = document.createElement('tr');
      if (isScreen && screenHighlight[h]) row.className = screenHighlight[h];
      if (isZaskleni && zaskleniHighlight[h]) row.className = zaskleniHighlight[h];
      const th = document.createElement('th');
      th.textContent = h;
      th.setAttribute('data-row', ri);
      th.setAttribute('data-si', si);
      if (stojnaFn) { const sz = stojnaFn(0, h); if (sz > 2) th.classList.add('stojna-' + sz); }
      row.appendChild(th);
      sec.horizontalValues.forEach((w, ci) => {
        const td = document.createElement('td');
        const p = sec.prices[ri][ci];
        td.setAttribute('data-row', ri);
        td.setAttribute('data-col', ci);
        td.setAttribute('data-si', si);
        if (p === 0 || p == null) { td.textContent = '\u2014'; td.classList.add('cell-na'); }
        else { td.textContent = p; }
        if (stojnaFn) { const sz = stojnaFn(w, h); if (sz > 2) td.classList.add('stojna-' + sz); }
        row.appendChild(td);
      });
      // Option columns
      optionKeys.forEach(key => {
        const td = document.createElement('td');
        td.className = 'option-cell';
        const v = (sec.options[key] || [])[ri];
        if (v == null || v === 0) { td.textContent = '\u2014'; td.classList.add('cell-na'); }
        else { td.textContent = v; td.setAttribute('data-option', key); }
        row.appendChild(td);
      });
      tbody.appendChild(row);
    });
    table.appendChild(tbody);

    // Horizontal footer (e.g. lamela counts for Bioclimatic)
    if (product.horizontalFooter && product.horizontalFooter.values) {
      const tfoot = document.createElement('tfoot');
      tfoot.className = 'matrix-footer';
      const frow = document.createElement('tr');
      const labelTh = document.createElement('th');
      labelTh.className = 'footer-label';
      labelTh.textContent = product.horizontalFooter.label || '';
      frow.appendChild(labelTh);
      sec.horizontalValues.forEach((w, ci) => {
        const fci = product.horizontalValues ? product.horizontalValues.indexOf(w) : ci;
        const td = document.createElement('td');
        td.className = 'footer-cell';
        const v = product.horizontalFooter.values[fci >= 0 ? fci : ci];
        td.textContent = v != null ? v : '';
        frow.appendChild(td);
      });
      tfoot.appendChild(frow);
      table.appendChild(tfoot);
    }

    // Per-variant description (multi-matrix products with knowledge.md)
    if (sec.description) {
      const descTbody = document.createElement('tbody');
      descTbody.className = 'matrix-section-desc';
      const descRow = document.createElement('tr');
      const descCell = document.createElement('td');
      descCell.setAttribute('colspan', totalCols);
      descCell.innerHTML = mdToHtml(sec.description);
      descRow.appendChild(descCell);
      descTbody.appendChild(descRow);
      table.appendChild(descTbody);
    }
  });

  // Stojna + footer legend
  const legend = document.getElementById('stojnaLegend');
  const items = [];
  if (stojnaFn) {
    const zones = new Set();
    const allH = sections.flatMap(s => s.horizontalValues);
    const allV = sections.flatMap(s => s.verticalValues);
    allH.forEach(w => allV.forEach(h => { const z = stojnaFn(w, h); if (z > 2) zones.add(z); }));
    const labels = zoneSpec.labels;
    [...zones].sort((a, b) => a - b).forEach(z => {
      items.push(`<span class="legend-item"><span class="legend-swatch swatch-${z}"></span>${labels[z]}</span>`);
    });
  }
  if (product.horizontalFooter && product.horizontalFooter.values) {
    const l = product.horizontalFooter.label || '';
    items.push(`<span class="legend-item legend-footer-note"><span class="legend-swatch swatch-footer"></span>řada čísel pod maticí = ${l} pro danou šířku</span>`);
  }
  if (items.length) {
    legend.innerHTML = items.join('');
    legend.classList.remove('hidden');
  } else {
    legend.classList.add('hidden');
  }

  document.getElementById('mainContent').scrollTop = 0;
  wrap.scrollTop = 0;
  wrap.scrollLeft = 0;
  bindMatrixEvents(table, sections);
  setTimeout(checkScrollHint, 50);
}

// ─── MATRIX EVENTS ───
function bindMatrixEvents(table, sections) {
  let lastSi = -1, lastRow = -1, lastCol = -1;
  const wrap = document.getElementById('matrixWrap');

  function getSection(si) {
    return {
      tbody: table.querySelector(`tbody[data-si="${si}"]`),
      thead: table.querySelectorAll('thead')[si]
    };
  }

  function clearHover() {
    table.querySelectorAll('.row-highlight, .col-highlight, .cell-active').forEach(el =>
      el.classList.remove('row-highlight', 'col-highlight', 'cell-active'));
  }
  function clearPin() {
    wrap.querySelectorAll('.pin-row, .pin-col, .pin-cell').forEach(el =>
      el.classList.remove('pin-row', 'pin-col', 'pin-cell'));
  }
  function highlight(si, row, col, cls) {
    const { tbody, thead } = getSection(si);
    if (!tbody || !thead) return;
    tbody.querySelectorAll(`td[data-row="${row}"]`).forEach(el => el.classList.add(cls === 'pin' ? 'pin-row' : 'row-highlight'));
    tbody.querySelectorAll(`th[data-row="${row}"]`).forEach(el => el.classList.add(cls === 'pin' ? 'pin-row' : 'row-highlight'));
    tbody.querySelectorAll(`td[data-col="${col}"]`).forEach(el => el.classList.add(cls === 'pin' ? 'pin-col' : 'col-highlight'));
    thead.querySelectorAll(`th[data-col="${col}"]`).forEach(el => el.classList.add(cls === 'pin' ? 'pin-col' : 'col-highlight'));
    const active = tbody.querySelector(`td[data-row="${row}"][data-col="${col}"]`);
    if (active) {
      active.classList.remove(cls === 'pin' ? 'pin-row' : 'row-highlight', cls === 'pin' ? 'pin-col' : 'col-highlight');
      active.classList.add(cls === 'pin' ? 'pin-cell' : 'cell-active');
    }
  }

  table.addEventListener('mousemove', (e) => {
    const cell = e.target.closest('td[data-si]');
    if (!cell) return;
    const si = parseInt(cell.getAttribute('data-si'));
    const row = parseInt(cell.getAttribute('data-row'));
    const col = parseInt(cell.getAttribute('data-col'));
    if (si === lastSi && row === lastRow && col === lastCol) return;
    clearHover();
    lastSi = si; lastRow = row; lastCol = col;
    highlight(si, row, col, 'hover');
  });

  table.addEventListener('mouseleave', () => { lastSi = -1; lastRow = -1; lastCol = -1; clearHover(); });

  table.addEventListener('click', (e) => {
    const cell = e.target.closest('td[data-si]');
    if (!cell || cell.classList.contains('cell-na')) return;
    const si = parseInt(cell.getAttribute('data-si'));
    const ri = parseInt(cell.getAttribute('data-row'));
    const ci = parseInt(cell.getAttribute('data-col'));
    clearPin();
    highlight(si, ri, ci, 'pin');

    const sec = sections[si];
    const price = parseInt(cell.textContent.trim());
    const width = sec.horizontalValues[ci];
    const depth = sec.verticalValues[ri];
    const baseName = currentProduct.catalogName || currentProduct.name;
    const name = sec.label ? `${baseName} ${sec.label}` : baseName;

    copyToClipboard(String(price));
    showToast(`Zkopírováno: ${price}`);
    cell.classList.add('copied-flash');
    setTimeout(() => cell.classList.remove('copied-flash'), 200);
    updateSelectionBar(name, width, depth, price, sec.label);
  });
}

// ─── SELECTION BAR ───
function updateSelectionBar(name, width, depth, price, sectionLabel) {
  document.getElementById('selProductName').textContent = name;
  const dimsInput = document.getElementById('selDims');
  const prefix = sectionLabel ? `${sectionLabel} ` : '';
  dimsInput.value = `${prefix}${width} × ${depth} mm`;
  const charLen = prefix.length + String(width).length + 3 + String(depth).length + 7;
  dimsInput.style.width = `${charLen}ch`;
  dimsInput.onclick = () => copyFromInput(dimsInput);

  const priceInput = document.getElementById('selPrice');
  priceInput.value = price;
  priceInput.style.width = `${String(price).length + 4}ch`;
  priceInput.onclick = () => copyFromInput(priceInput);

  // Cost
  const costGroup = document.getElementById('selCostGroup');
  const costInput = document.getElementById('selCost');
  if (currentProduct.costPercent > 0) {
    const cost = Math.round(price * currentProduct.costPercent / 100);
    costInput.value = cost;
    costInput.style.width = `${String(cost).length + 4}ch`;
    costInput.onclick = () => copyFromInput(costInput);
    costGroup.style.display = 'flex';
  } else {
    costGroup.style.display = 'none';
  }

  // Montáž — fixed CZK (e.g. screen) or percentage of catalog price
  document.querySelectorAll('#selInstallGroup .sel-install').forEach(input => {
    const fixed = input.getAttribute('data-fixed');
    const installPrice = fixed != null
      ? parseInt(fixed)
      : Math.round(price * parseInt(input.getAttribute('data-rate')) / 100);
    input.value = installPrice;
    input.style.width = `${String(installPrice).length + 4}ch`;
  });

  document.getElementById('selectionBar').classList.add('visible');
  document.getElementById('mainContent').classList.add('bar-visible');
}

// ─── COPY HELPERS ───
function copyToClipboard(text) {
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  });
}

function copyFromInput(input) {
  copyToClipboard(input.value);
  showToast(`Zkopírováno: ${input.value}`);
  input.classList.add('copied');
  setTimeout(() => input.classList.remove('copied'), 300);
}

// ─── TOAST ───
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 1500);
}

// ─── SCROLL HINT ───
function checkScrollHint() {
  const wrap = document.getElementById('matrixWrap');
  const table = wrap.querySelector('table:not([style*="display: none"])') || wrap.querySelector('table');
  if (!table) return;
  wrap.classList.toggle('show-scroll-hint', table.scrollWidth > wrap.clientWidth + 20);
  wrap.addEventListener('scroll', function hideHint() {
    wrap.classList.remove('show-scroll-hint');
  }, { once: true });
}

// ─── ADMIN PANEL ───
let adminUnlocked = false;
const ADMIN_PIN = '2025';

function toggleAdmin() {
  const overlay = document.getElementById('adminOverlay');
  const toggle = document.getElementById('adminToggle');

  if (!adminUnlocked) {
    const pin = prompt('PIN pro nastavení:');
    if (pin !== ADMIN_PIN) return;
    adminUnlocked = true;
  }

  const isOpen = overlay.classList.toggle('visible');
  toggle.classList.toggle('open', isOpen);
  if (isOpen) populateAdmin();
}

function populateAdmin() {
  // Install rates
  const installRow = document.getElementById('adminInstallRow');
  installRow.innerHTML = '';
  catalog.installationRates.forEach((rate, i) => {
    const label = document.createElement('label');
    label.textContent = `Sazba ${i + 1}:`;
    const input = document.createElement('input');
    input.type = 'number';
    input.className = 'admin-input num';
    input.value = rate;
    input.setAttribute('data-install-idx', i);
    installRow.appendChild(label);
    installRow.appendChild(input);
  });

  // Products table
  const tbody = document.getElementById('adminTableBody');
  tbody.innerHTML = '';
  catalog.products.forEach((entry, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="product-cell">${entry.name}</td>
      <td><input type="text" class="admin-input weeks" data-field="discount" data-idx="${i}" value="${entry.discount || ''}"></td>
      <td><input type="number" class="admin-input num" data-field="costPercent" data-idx="${i}" value="${entry.costPercent || 0}" min="0" max="100"></td>
      <td><input type="text" class="admin-input weeks" data-field="deliveryWeeks" data-idx="${i}" value="${entry.deliveryWeeks || ''}"></td>
      <td><input type="text" class="admin-input note" data-field="deliveryNote" data-idx="${i}" value="${entry.deliveryNote || ''}"></td>
    `;
    tbody.appendChild(tr);
  });
}

function collectAdminData() {
  // Collect install rates
  const installInputs = document.querySelectorAll('#adminInstallRow input');
  const installationRates = Array.from(installInputs).map(inp => parseInt(inp.value) || 0);

  // Collect product data
  const products = catalog.products.map((entry, i) => {
    const get = (field) => {
      const inp = document.querySelector(`[data-field="${field}"][data-idx="${i}"]`);
      return inp ? inp.value : '';
    };
    const updated = {
      id: entry.id,
      name: entry.name,
      folder: entry.folder,
      discount: get('discount'),
      costPercent: parseInt(get('costPercent')) || 0,
      deliveryWeeks: get('deliveryWeeks')
    };
    const note = get('deliveryNote').trim();
    if (note) updated.deliveryNote = note;
    if (entry.description) updated.description = entry.description;
    return updated;
  });

  return { installationRates, products };
}

async function saveAdmin() {
  const data = collectAdminData();
  const json = JSON.stringify(data, null, 2) + '\n';

  // Try server API first (local dev with server.js)
  try {
    const resp = await fetch('/api/save-catalog', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: json
    });
    if (resp.ok) {
      showAdminSaved('Uloženo na server');
      reloadAfterSave(data);
      return;
    }
  } catch (e) { /* server API not available — fallback */ }

  // Fallback: download file (GitHub Pages / static hosting)
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'catalog.json';
  a.click();
  URL.revokeObjectURL(url);
  showAdminSaved('Staženo — nahraď data/catalog.json a pushni');
  reloadAfterSave(data);
}

function showAdminSaved(text) {
  const msg = document.getElementById('adminSavedMsg');
  msg.textContent = '✓ ' + (text || 'Uloženo');
  msg.classList.add('visible');
  setTimeout(() => msg.classList.remove('visible'), 3000);
}

function reloadAfterSave(data) {
  // Update live catalog + allProducts so the app reflects changes immediately
  catalog.installationRates = data.installationRates;
  catalog.products = data.products;

  // Sync changes into allProducts
  data.products.forEach((entry, i) => {
    if (allProducts[i]) {
      allProducts[i].discountRaw = entry.discount;
      allProducts[i].discount = parseFirstNum(entry.discount);
      allProducts[i].costPercent = parseInt(entry.costPercent) || 0;
      allProducts[i].deliveryWeeks = entry.deliveryWeeks;
      allProducts[i].deliveryNote = entry.deliveryNote || '';
    }
  });

  // Rebuild install rate fields & re-render current product
  buildInstallGroups();
  if (currentProduct) {
    const idx = allProducts.findIndex(p => p.id === currentProduct.id);
    if (idx >= 0) showProduct(allProducts[idx]);
  }
}

// ─── VERSION CHECK / AUTO-REFRESH ───
// Reads version.txt from the deployed site (no GitHub API → no rate limits).
// A newer build reloads the app on its own, without asking — but never in the
// middle of someone reading or copying a price:
//   • on open or on returning to the tab → reload right away
//   • tab in the background              → reload silently now
//   • user active in the app             → wait until 15 s without input
// After the reload the user lands on the same product.
const RESTORE_KEY = 'pricelist_restore';
const RELOAD_IDLE_MS = 15000;

async function fetchDeployedVersion() {
  try {
    const r = await fetch(`../version.txt?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return null;
    const v = (await r.text()).trim();
    return v && v.length < 64 ? v : null;
  } catch (e) { return null; }
}

// True only for a build we have not already asked for. If the URL already
// carries ?v=<latest> but we still run older code, the CDN is lagging —
// reloading again would loop, so wait for the next check instead.
function isNewBuild(latest) {
  if (!latest || latest === BUILD_VERSION) return false;
  return new URL(location.href).searchParams.get('v') !== latest;
}

function reloadToVersion(v) {
  try {
    sessionStorage.setItem(RESTORE_KEY, JSON.stringify({ tab: currentProduct ? currentProduct.id : null }));
  } catch (e) {}
  const url = new URL(location.href);
  url.searchParams.set('v', v);
  location.replace(url.toString());
}

// Set by the previous page right before an auto-reload; read once.
function takeRestoreState() {
  try {
    const raw = sessionStorage.getItem(RESTORE_KEY);
    sessionStorage.removeItem(RESTORE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

let lastInteraction = Date.now();
['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart', 'scroll'].forEach(ev =>
  window.addEventListener(ev, () => { lastInteraction = Date.now(); }, { passive: true, capture: true }));

let pendingVersion = null;
let reloadTimer = null;

function tryAutoReload() {
  reloadTimer = null;
  if (!pendingVersion) return;
  const idleFor = Date.now() - lastInteraction;
  if (document.hidden || idleFor >= RELOAD_IDLE_MS) { reloadToVersion(pendingVersion); return; }
  reloadTimer = setTimeout(tryAutoReload, RELOAD_IDLE_MS - idleFor + 250);
}

function scheduleAutoReload(latest) {
  pendingVersion = latest;
  if (!reloadTimer) tryAutoReload();
}

// On open — the user is not mid-task yet, reload straight away.
async function versionCheckOnOpen() {
  if (IS_LOCAL) return;
  const latest = await fetchDeployedVersion();
  if (isNewBuild(latest)) reloadToVersion(latest);
}

function startVersionWatch() {
  if (IS_LOCAL) return;
  setInterval(async () => {
    const latest = await fetchDeployedVersion();
    if (isNewBuild(latest)) scheduleAutoReload(latest);
  }, 3 * 60 * 1000);

  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) {
      if (pendingVersion) reloadToVersion(pendingVersion);   // nobody is looking
      return;
    }
    // Back on the tab (e.g. from Raynet) — refresh before they start clicking.
    const latest = await fetchDeployedVersion();
    if (isNewBuild(latest)) reloadToVersion(latest);
  });
}

// ─── LOGIN GATE ───
// NOTE: cosmetic gate only. The page is public, so the password is readable
// in the page source — it keeps casual visitors out, it is not real security.
const normPassword = s => String(s || '').trim().toLowerCase();

// Login is remembered for AUTH_TTL_DAYS, so users are not asked every visit.
function isAuthed() {
  try {
    const raw = localStorage.getItem(AUTH_KEY);
    if (!raw) return false;
    const { u, v, at } = JSON.parse(raw);
    if (v !== AUTH_VERSION || !APP_USERS[u]) return false;
    return (Date.now() - at) < AUTH_TTL_DAYS * 24 * 60 * 60 * 1000;
  } catch (e) { return false; }
}

function rememberAuth(user) {
  try {
    localStorage.setItem(AUTH_KEY, JSON.stringify({ u: user, v: AUTH_VERSION, at: Date.now() }));
  } catch (e) {}
}

function showLogin() {
  const overlay = document.getElementById('loginOverlay');
  const form = document.getElementById('loginForm');
  const input = document.getElementById('loginInput');
  const error = document.getElementById('loginError');
  overlay.style.display = 'flex';
  setTimeout(() => input.focus(), 50);
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const entered = normPassword(input.value);
    if (APP_USERS[entered]) {
      rememberAuth(entered);
      startApp();
    } else {
      error.classList.add('visible');
      input.value = '';
      input.focus();
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
    }
  });
}

function startApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  loadCatalog();
  startVersionWatch();
}

// ─── START ───
versionCheckOnOpen();
if (isAuthed()) startApp();
else showLogin();
